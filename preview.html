                <a href={portfolioData.personal.github} target="_blank" rel="noopener noreferrer" className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white">
                  <IconGithub className="w-4 h-4" />
                </a>
                <a href={portfolioData.personal.linkedin} target="_blank" rel="noopener noreferrer" className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-[#0a66c2]">
                  <IconLinkedin className="w-4 h-4" />
                </a>
                <a href={`mailto:${portfolioData.personal.email}`} className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-indigo-400">
                  <IconMail className="w-4 h-4" />
                </a>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-8 text-xs text-slate-500">
              <p>© {new Date().getFullYear()} {portfolioData.personal.name}. All rights reserved.</p>
              <div className="flex items-center gap-4">
                <span className="font-mono text-[11px] text-slate-400">Built with <span className="text-cyan-400">React</span> & <span className="text-teal-400">Tailwind CSS</span></span>
                <button onClick={scrollToTop} className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white">
                  <IconChevronUp className="w-4 h-4" />
                </button>
              </div>
            </div>
          </div>
        </footer>
      );
    };

    // Main App
    function App() {
      const [toast, setToast] = useState('');

      return (
        <div className="min-h-screen bg-[#0a0f1d] text-slate-100 font-sans">
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 bg-slate-900/95 border border-indigo-500/40 text-white rounded-xl shadow-2xl backdrop-blur-md">
              <IconCheckCircle className="w-5 h-5 text-emerald-400" />
              <p className="text-sm">{toast}</p>
              <button onClick={() => setToast('')} className="ml-2 text-slate-400 hover:text-white">
                <IconX className="w-4 h-4" />
              </button>
            </div>
          )}

          <Navbar />
          <main>
            <Hero />
            <About />
            <Skills />
            <Projects />
            <Education />
            <Contact onToast={(msg) => setToast(msg)} />
          </main>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
